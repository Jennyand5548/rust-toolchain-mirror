name: Mirror Rust Toolchain (Linux, Mac, Windows)

on:
  workflow_dispatch: {}          # manual "Run workflow" button, no input needed
  schedule:
    - cron: "0 6 1 * *"          # also auto-checks once a month, on the 1st at 06:00 UTC

permissions:
  contents: write   # only permission granted: create a release, upload assets

jobs:
  resolve-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Fetch official stable-channel manifest and its signature
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLO \
            https://static.rust-lang.org/dist/channel-rust-stable.toml
          curl --proto '=https' --tlsv1.2 -fsSLO \
            https://static.rust-lang.org/dist/channel-rust-stable.toml.asc

      - name: Import Rust's official release-signing key
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rust-key.gpg.ascii | gpg --import

      - name: Verify the fingerprint matches Rust's published key exactly
        run: |
          EXPECTED="108F66205EAEB0AAA8DD5E1C85AB96E6FA1BE5FE"
          ACTUAL=$(gpg --with-colons --fingerprint | awk -F: '$1=="fpr"{print $10; exit}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Fingerprint mismatch — refusing to trust this manifest."
            exit 1
          fi

      - name: Verify the manifest's signature before trusting the version it names
        run: gpg --verify channel-rust-stable.toml.asc channel-rust-stable.toml

      - name: Extract the current stable version number
        id: resolve
        run: |
          # The manifest has a "version" line under every [pkg.xxx] section
          # (rustc, cargo, rust-std, etc). We must only read the one inside
          # [pkg.rust] — that's the number that matches the release tarballs.
          RAW=$(awk '
            /^\[pkg\.rust\]/ { in_section=1; next }
            /^\[/            { in_section=0 }
            in_section && /^version[ \t]*=/ { print; exit }
          ' channel-rust-stable.toml | cut -d '"' -f2)
          VERSION=$(echo "$RAW" | awk '{print $1}')
          echo "Resolved latest stable Rust version: $VERSION"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Extracted version '$VERSION' doesn't look like a real version number — refusing to proceed."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  mirror:
    needs: resolve-version
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    strategy:
      fail-fast: false   # one bad/unsupported target shouldn't cancel the other 31
      matrix:
        target:
          # Linux (glibc)
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - i686-unknown-linux-gnu
          - arm-unknown-linux-gnueabi
          - arm-unknown-linux-gnueabihf
          - armv7-unknown-linux-gnueabihf
          - powerpc-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - powerpc64le-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - s390x-unknown-linux-gnu
          - loongarch64-unknown-linux-gnu
          # Linux (musl)
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - powerpc64-unknown-linux-musl
          - powerpc64le-unknown-linux-musl
          - loongarch64-unknown-linux-musl
          # Linux (OpenHarmony)
          - aarch64-unknown-linux-ohos
          # Mac
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          # Windows
          - x86_64-pc-windows-msvc
          - x86_64-pc-windows-gnu
          - x86_64-pc-windows-gnullvm
          - aarch64-pc-windows-msvc
          - aarch64-pc-windows-gnullvm
          - i686-pc-windows-msvc
          - i686-pc-windows-gnu
          # BSD / Solaris / illumos
          - x86_64-unknown-freebsd
          - aarch64-unknown-freebsd
          - x86_64-unknown-netbsd
          - x86_64-pc-solaris
          - sparcv9-sun-solaris
          - x86_64-unknown-illumos

    steps:
      - name: Set filenames
        id: names
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          TARBALL="rust-${VERSION}-${TARGET}.tar.gz"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL"   >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already mirrored
        id: check
        run: |
          TAG="v${{ steps.names.outputs.version }}"
          if gh release view "$TAG" --json assets \
             --jq ".assets[].name" 2>/dev/null | grep -qx "${{ steps.names.outputs.tarball }}"; then
            echo "already_mirrored=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_mirrored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download official tarball and signature from static.rust-lang.org
        if: steps.check.outputs.already_mirrored == 'false'
        run: |
          curl --proto '=https' --tlsv1.2 -fSLO \
            "https://static.rust-lang.org/dist/${{ steps.names.outputs.tarball }}"
          curl --proto '=https' --tlsv1.2 -fSLO \
            "https://static.rust-lang.org/dist/${{ steps.names.outputs.tarball }}.asc"

      - name: Import Rust's official release-signing key
        if: steps.check.outputs.already_mirrored == 'false'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rust-key.gpg.ascii | gpg --import

      - name: Verify the fingerprint matches Rust's published key exactly
        if: steps.check.outputs.already_mirrored == 'false'
        run: |
          EXPECTED="108F66205EAEB0AAA8DD5E1C85AB96E6FA1BE5FE"
          ACTUAL=$(gpg --with-colons --fingerprint | awk -F: '$1=="fpr"{print $10; exit}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Fingerprint mismatch — refusing to publish an unverified file."
            exit 1
          fi

      - name: Verify the tarball's signature
        if: steps.check.outputs.already_mirrored == 'false'
        run: gpg --verify "${{ steps.names.outputs.tarball }}.asc" "${{ steps.names.outputs.tarball }}"

      - name: Publish as a GitHub Release
        if: steps.check.outputs.already_mirrored == 'false'
        run: |
          TAG="v${{ steps.names.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading these assets to it"
            gh release upload "$TAG" \
              "${{ steps.names.outputs.tarball }}" \
              "${{ steps.names.outputs.tarball }}.asc" \
              --clobber
          else
            gh release create "$TAG" \
              "${{ steps.names.outputs.tarball }}" \
              "${{ steps.names.outputs.tarball }}.asc" \
              --title "Rust ${{ steps.names.outputs.version }} (official, all platforms)" \
              --notes "Unmodified official standalone installers, mirrored from static.rust-lang.org after GPG signature verification. Do not trust a file if its 'Verify' step did not pass." \
              --latest \
              || { echo "Create failed, likely a race with another matrix job — retrying as upload"; \
                   gh release upload "$TAG" \
                     "${{ steps.names.outputs.tarball }}" \
                     "${{ steps.names.outputs.tarball }}.asc" \
                     --clobber; }
          fi
